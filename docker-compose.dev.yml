# Local development: MongoDB and an S3-compatible server standing in for R2.
# Run the app itself on the host with `npm run build-watch` and `npm run start-watch`.
# Matching config.json values:
#   mongodb.url       mongodb://127.0.0.1:27019/commutag
#   storage.endpoint  http://127.0.0.1:9010   (bucket "commutag", forcePathStyle true)
#   storage.accessKeyId / secretAccessKey  commutag / commutag-dev-secret
services:
  mongo:
    image: mongo:7
    ports:
      - "127.0.0.1:27019:27017"
    volumes:
      - mongo-dev:/data/db
  s3:
    image: chrislusf/seaweedfs
    command: server -s3 -s3.config=/etc/s3.json
    ports:
      - "127.0.0.1:9010:8333"
    volumes:
      - ./docker/s3-dev.json:/etc/s3.json:ro
      - s3-dev:/data
volumes:
  mongo-dev:
  s3-dev:
