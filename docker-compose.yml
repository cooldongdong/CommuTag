# Production: the app plus MongoDB. Photos live in Cloudflare R2 (config.json
# "storage"), so the only state on this machine is the database volume, which
# scripts/backup-mongo.sh copies to R2 every night.
#
# MongoDB has no published port: only the app can reach it, over the internal
# network. The app listens on 127.0.0.1 only; put a reverse proxy or a
# Cloudflare Tunnel in front for HTTPS.
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
  commutag:
    build: .
    restart: unless-stopped
    depends_on:
      - mongo
    volumes:
      - ./config.json:/app/config.json:ro
      - ./log:/app/log
    ports:
      - "127.0.0.1:8001:8001"
volumes:
  mongo-data:
